# ---------------------------------------------------------------------------
# Trading hours. All boundaries are named parameters. Never implement Eastern
# Time as a fixed UTC offset; use a DST-aware library (zoneinfo).
# ---------------------------------------------------------------------------
trading_hours:
  classification: FIXED-MARKET
  globex_open: {time: "17:00", tz: America/Chicago, day: Sunday}
  globex_close: {time: "16:00", tz: America/Chicago, day: Friday}
  maintenance_break:
    start: {time: "16:00", tz: America/Chicago}
    end: {time: "17:00", tz: America/Chicago}
    days: [Monday, Tuesday, Wednesday, Thursday]
  source: https://www.cmegroup.com/markets/equities/sp/micro-e-mini-sandp-500.contractSpecs.html
  accessed: 2026-07-31
  evidence_level: moderate
  note: >
    CME publishes hours in Central Time. The strategy's session boundaries are defined
    in America/New_York per the design requirement. Both zones are DST-aware and must
    be converted through zoneinfo, never through a fixed offset. Exchange timestamps
    are additionally retained in UTC.

# ---------------------------------------------------------------------------
# Roll policy.
# ---------------------------------------------------------------------------
roll:
  classification: DESIGN
  method: volume_crossover
  rule: >
    The active contract is the dated contract with the greater trailing 1-session
    total volume, evaluated at each session close using only data available at that
    close. Roll takes effect at the START of the following session, never intrabar.
  stop_new_entries_days_before_expiry: 5
  open_position_policy_at_roll: close_in_expiring_contract_do_not_migrate
  back_adjustment: forbidden_for_executable_levels
  note: >
    Unadjusted traded prices from the active dated contract are used for VWAP, bands,
    volume profile, opening range, stops, targets, fills, and P&L. A back-adjusted
    continuous series may be constructed for long-horizon regime research only, must
    record its adjustment method, and is forbidden from feeding any executable level.
    Roll weeks are additionally tagged so results can be reported with and without them.
